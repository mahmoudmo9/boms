[project]
name = "boms"
version = "0.2.0"
description = "BOMS - trading and order management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "keyring>=25",
    "pymupdf>=1.24,<2",
    "pyzipper>=0.3.6",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
