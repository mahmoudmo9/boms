[project]
name = "boms"
version = "0.1.0"
description = "BOMS - trading and order management (Phase 1: system skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "keyring>=25",
    "pymupdf>=1.26,<2",
    "pyzipper>=0.3.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
